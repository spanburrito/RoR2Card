const V={

<div class="panel"><h2>Play online</h2>Your name <input id="on" value="Player" style="width:120px"> <button onclick="host()">Host game</button> <input id="rc" placeholder="Room code" style="width:110px;text-transform:uppercase"> <button onclick="join()">Join</button><div class="m">Peer-to-peer over WebRTC. The host's tab runs the game, so keep it open. Uses the "first to" and inventory settings above.</div></div>

score:()=>{const R=calc(),f=v=>Math.round(v*100)/100;return `<div class="panel"><h2>Round ${G.r}: scores</h2><p class="m">Scores are calculated automatically from every card. Pick targets for “Opp” effects, tick once-per-game abilities or Equipment, or type an override if a score looks wrong. One-shots are discarded automatically when you finish the round. Equipment you use starts its cooldown when the round ends. Draw effects (Fuel Cell, Lepton Daisy), Chef and Drifter are still manual. Deck: ${G.deck.length}, discard: ${G.disc.length}.</p></div>`+G.P.map((p,i)=>{const x=R[i],st=x.st;

function ap(m,w){const i=m.i,t=m.a,p=G.P[i];
 if(w>=0){if(["sel","ok","trim"].includes(t)){if(w!=G.i)return}else if(["w","ov","fin"].includes(t)?w!=0:(w!=0&&w!=i))return}
