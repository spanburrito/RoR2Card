 else if(t=="pp"){const q=G.pend[0];if(ph!="pend"||!q||q.tr||!q.c.includes(m.id))return;const p2=G.P[q.i];p2.inv.push(m.id);
  if(q.k=="salv"){G.disc=G.disc.filter(x=>x!=m.id);G.pend.forEach(z=>{if(z.k=="salv")z.c=z.c.filter(x=>x!=m.id)})}else G.deck.unshift(...q.c.filter(x=>x!=m.id));
  if(slots(p2)>lim(p2)){q.tr=1;render()}else pendNext()}
 else if(t=="ps"){const q=G.pend[0];if(ph!="pend"||!q||q.k!="salv"||q.tr)return;pendNext()}
 else if(t=="pt"){const q=G.pend[0];if(ph!="pend"||!q||!q.tr)return;const p2=G.P[q.i];if(!p2.inv.includes(m.id))return;p2.inv=p2.inv.filter(x=>x!=m.id);G.disc.push(m.id);if(slots(p2)>lim(p2))render();else pendNext()}
 else if(t=="drop")drop(i,m.id);else if(t=="tg"){p.tg[m.id]=m.v;render()}else if(t=="ou"){p.ou=m.v;render()}else if(t=="w"){p.w=Math.max(0,p.w+m.v);render()}else if(t=="ov")p.ov=m.v;else if(t=="fin"&&ph=="score")fin()}
function render(){$.innerHTML=`<div class="top"><b>Risk of Rain 2 Card Game${G&&ph!="menu"&&ph!="cards"&&ph!="end"?" · Round "+G.r+" · first to "+ui.target+" wins":""}</b><span>${ph!="cards"?`<button onclick="back=ph;ph='cards';render()">📖 Cards</button> `:""}${ph!="menu"&&ph!="cards"?`<button onclick="if(confirm('Quit this game?')){ONL?location.reload():(ph='menu',render())}">Quit</button>`:""}</span></div>`+V[ph]();if(ONL==1&&G&&ph!="lobby")conns.forEach(c=>c.seat!=null&&send(c,snap(c.seat)))}

function margin(i){
  const R=calc();let o=-Infinity;R.forEach((x,j)=>{if(j!==i&&x.sc>o)o=x.sc});
  return R[i].sc+(R[i].sc-o);

function shrink(p){
  while(slots(p)>lim(p)&&p.inv.length>1){
    let b=null,bv=-Infinity;
    p.inv.slice().forEach(id=>{const o=p.inv;p.inv=o.filter(x=>x!=id);const v=margin(G.P.indexOf(p));p.inv=o;if(b===null||v>bv){bv=v;b=id}});
    p.inv=p.inv.filter(x=>x!=b);
  }
}
function project(i,inv0,rest){
  const p=G.P[i],keep={inv:p.inv,lost:p.lost,r:G.r};
  const r0=G.r;let total=0;
  for(let s=0;s<SAMPLES;s++){
    const pl=rest.slice();p.inv=inv0.slice();
    for(let k=0;k<HZ;k++){
      G.r=r0+k;shrink(p);

        let best=null,bv=-Infinity;

}
